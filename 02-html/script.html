        <header>
            <h1>02 - Script</h1>
            <h2>Etiqueta para incluir código JavaScript en el documento.</h2>
        </header>
        <section>
            <p class="user">Welcome 😎, guest!</p>
        </section>
<script>
    const user= document.querySelector('.user');
    const answer= prompt('¿What is your name?');
    if (answer) {
        user.textContent = `Welcome 😎, ${answer}!`;
    } else {
        user.textContent = 'Welcome 😐, guest!';
    }
</script>
