<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11-Forms</title>
    <link rel="stylesheet" href="../src/css/02-html.css">
    <link rel="stylesheet" href="../src/css/forms.css">
</head>
<body>
    <a href="index.html" class="boton-volver">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#000000" viewBox="0 0 256 256">
            <path d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path>
        </svg>
    </a>
    <main>
        <header>
            <h1>11 - Forms</h1>
            <h2>Creates interactive forms for user input.</h2>
        </header>

        <div class="forms-container">
            <!-- Registration Form -->
            <div class="form-card">
                <h3>Registration Form</h3>
                <form action="#" method="POST" class="form">
                    <div class="form-group">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Tilin" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" placeholder="pontucorre@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age:</label>
                        <input type="number" id="age" name="age" min="18" max="100" placeholder="18">
                    </div>
                    <div class="form-group">
                        <label for="country">Country:</label>
                        <select id="country" name="country">
                            <option value="">Select a country</option>
                            <option value="us">Estados Unidos</option>
                            <option value="uk">España</option>
                            <option value="ca">Colombia</option>
                            <option value="au">Australia</option>
                            <option value="es">Argentina</option>
                            <option value="mx">Mexico</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Gender:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="male"> Hombre</label>
                            <label><input type="radio" name="gender" value="female"> Mujer</label>
                            <label><input type="radio" name="gender" value="other"> Otro</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Interests:</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="interests" value="tech"> Technology</label>
                            <label><input type="checkbox" name="interests" value="sports"> Sports</label>
                            <label><input type="checkbox" name="interests" value="music"> Music</label>
                            <label><input type="checkbox" name="interests" value="art"> Art</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="bio">Bio:</label>
                        <textarea id="bio" name="bio" rows="4" placeholder="Tell us about yourself..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Register</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                </form>
            </div>

            <!-- Contact Form -->
            <div class="form-card">
                <h3>Contact Us</h3>
                <form action="#" method="POST" class="form">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-email">Email:</label>
                        <input type="email" id="contact-email" name="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject:</label>
                        <input type="text" id="subject" name="subject" placeholder="Message subject">
                    </div>
                    <div class="form-group">
                        <label for="priority">Priority:</label>
                        <select id="priority" name="priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" name="newsletter" value="yes"> Subscribe to newsletter
                        </label>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Send Message</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>
            </div>

            <!-- Login Form -->
            <div class="form-card">
                <h3>Login</h3>
                <form action="#" method="POST" class="form">
                    <div class="form-group">
                        <label for="login-email">Email or Username:</label>
                        <input type="text" id="login-email" name="username" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password:</label>
                        <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember" value="1"> Remember me
                        </label>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Login</button>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                </form>
            </div>

            <!-- Survey Form -->
            <div class="form-card">
                <h3>Quick Survey</h3>
                <form action="#" method="POST" class="form">
                    <div class="form-group">
                        <label>How did you find us?</label>
                        <select name="referrer">
                            <option value="">Select an option</option>
                            <option value="search">Search Engine</option>
                            <option value="social">Social Media</option>
                            <option value="friend">Friend/Family</option>
                            <option value="ad">Advertisement</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Would you recommend us?</label>
                        <div class="radio-group">
                            <label><input type="radio" name="recommend" value="yes"> Definitely yes</label>
                            <label><input type="radio" name="recommend" value="maybe"> Maybe</label>
                            <label><input type="radio" name="recommend" value="no"> Not really</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="rating">Rating (1-10):</label>
                        <input type="range" id="rating" name="rating" min="1" max="10" value="7">
                        <output for="rating" class="rating-value">7</output>
                    </div>
                    <div class="form-group">
                        <label for="feedback">Feedback:</label>
                        <textarea id="feedback" name="feedback" rows="3" placeholder="Any suggestions?"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Submit Survey</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Simple script to update range output value
        const rangeInput = document.getElementById('rating');
        if (rangeInput) {
            const output = document.querySelector('output[for="rating"]');
            rangeInput.addEventListener('input', function() {
                output.textContent = this.value;
            });
        }
    </script>
</body>
</html>
