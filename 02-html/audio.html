<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13-Audio</title>
    <link rel="stylesheet" href="../src/css/02-html.css">
    <link rel="stylesheet" href="../src/css/audio.css">
</head>
<body>
    <a href="index.html" class="boton-volver">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#000000" viewBox="0 0 256 256">
            <path d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path>
        </svg>
    </a>
    <main>
        <header>
            <h1>13 - Audio</h1>
            <h2>Inserts audio files.</h2>
        </header>

        <div class="audio-container">
            <!-- Audio Player 1: Your custom audio -->
            <div class="audio-card">
                <div class="audio-icon">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#4a90e2" stroke-width="1.5">
                        <path d="M9 18V5l12-2v13" stroke="currentColor"/>
                        <circle cx="6" cy="18" r="3" stroke="currentColor"/>
                        <circle cx="18" cy="16" r="3" stroke="currentColor"/>
                        <path d="M9 12l12-2" stroke="currentColor"/>
                    </svg>
                </div>
                <h3>Your Audio Player</h3>
                <p class="audio-description">Replace the src attribute with your own audio file</p>
                
                <!-- Audio element - CHANGE THE src TO YOUR AUDIO FILE -->
                <audio controls controlsList="nodownload" class="custom-audio">
                    <source src="./audio/sena.mp3" type="audio/mpeg">
                    <source src="./audio/sena.ogg" type="audio/ogg">
                    <source src="./audio/sena.wav" type="audio/wav">
                    Your browser does not support the audio element.
                </audio>
                
                
        
    </main>

    
</body>
</html>
