<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-animations</title>
    <link rel="stylesheet" href="../03-css/style.css">
    <style>
        main section {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 80vh; 

                div.jungle {
                background: url(../src/imgs/jungle.png) no-repeat center;
                border-radius: 4px;
                margin-block: 2rem;
                position: relative;
                height: 471px;
                width: 380px;
                img {
                    border-radius: 0%;
                    border: none;
                    position: absolute;
                }
                img.logo {
                    top: 35px;
                    left: 30px;
                    height: 70px;
                    object-fit: contain;
                    z-index: 9;
                    width: 317px;
                    animation: 1s animLogo ease-in infinite;
                }
                img.dk {
                    top: 120px;
                    left: 120px;
                    width: 140px;
                    object-fit: contain;
                    z-index: 8;
                    animation: 2s animDK ease-out infinite;
                }
                 div.move {
                    position: absolute;
                    top: 240px;
                    left: 0;
                    img.ryno {
                        width: 140px;
                        object-fit: contain;
                        top: 0;
                        animation: 0.4s animRyno linear infinite;
                    }
                }
            }
        }
    @keyframes animLogo {
        0%, 10% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.2);
        }
    }
    @keyframes animDK {
        0% {top: 130px; transform:  rotatex(0deg);}
        40% {top: 80px; transform:  rotatex(0deg);}
        50% {top: 80px; transform:  rotatex(360deg);}
        60% {top: 80px; transform:  rotatex(360deg);}
        100% {top: 130px; transform:  rotatex(360deg);}   
    }
    @keyframes animRyno {
        0%, 100% {top: 0px;}
        50% {top: -8px;}
        30% {
             left: 50px; 
            }
            45% {
                left: 180px; 
            }
            70% {
                left: 180px; 
            }
    }
    </style>
</head>
<body>
    <a href="../03-css/index.html" class="home-button">
    <span class="home-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </span>
    <span class="home-text">Volver</span>
    </a>
    <main>
        <header>
            <h1>37-Animations</h1>
            <h2>Lets an element gradually change from one style to another.</h2>
        </header>
        <section>
            <div class="recuadro">
            <div class="jungle">
                <img src="../src/imgs/logo-dk.png" class="logo">
                <img src="../src/imgs/dk.png" class="dk">
                <div class="move">
                    <img src="../src/imgs/ryno.png" class="ryno">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
