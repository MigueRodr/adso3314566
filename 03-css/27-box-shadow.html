<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00-Title</title>
    <link rel="stylesheet" href="../03-css/style.css">
    <style>
        div.box{
            border-radius: 20%;
            height: 200px;
            width: 200px;
            background-color: rgb(255, 255, 255);
            margin: 0 auto;
        }
        div.box1{
            box-shadow: 0 0 12px #7829f0;
        }
        div.box2{
            box-shadow: -10px -10px 24px 0 #57ff79;
        }
        div.box3{
            box-shadow: 0 0 20px #fffa64
        }
        div.box4{
            box-shadow: 4px 4px 0 #cc0,
                        8px 8px 0 #00c,
                        12px 12px 0 #c00

        }
        div.images img{
           width: 300px;
        }
        div.images{
            display: flex;
            justify-content: center;
            margin-block: 2rem;
            gap: 1rem;
        }
        div.images img:first-child{
            box-shadow: 0 0 12px #fff;
        }
        div.images img:last-child{
            filter: drop-shadow(0 0 12px #fff);
        }

    </style>
</head>
<body>
    <a href="../03-css/index.html" class="home-button">
    <span class="home-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </span>
    <span class="home-text">Volver</span>
</a>
    <main>
        <header>
            <h1>27- Box Shadow</h1> <br>
            <h2>Property attaches one or more shadows to an element.</h2>
        </header>
    <section>
        <div class="recuadro">
        <h3>box-shadow: 0 0 12px #fff</h3>
        <br>
        <div class="box box1"></div>
        <br>
        <h3>box-shadow: -10px -10px 24px 0 #fff</h3>
        <br>
        <div class="box box2"></div>
        <br>
        <h3>box-shadow: 0 0 20px #fff</h3>
        <br>
        <div class="box box3"></div>
        <br>
        <h3>box-shadow: multiple </h3>
        <br>
        <div class="box box4"></div>
        <br>
        <h3>box-shadow vs drop-shadow</h3>
        <br>
        <div class="images">
            <img src="../src/imgs/masterchief.png" width="180">
            <img src="../src/imgs/masterchief.png" width="180">
        </div>
    </section>
    </main>
</body>
</html>
