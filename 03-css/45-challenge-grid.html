<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge-grid</title>
    <link rel="stylesheet" href="../03-css/style.css">
    <style>
        /* --- Estilos específicos para el ejercicio 44-Grid --- */

        /* Contenedor .recuadro: fondo negro y centrado con flex */
        .recuadro {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Grid principal */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 10px;
            width: 850px;
            max-width: 95%;
            aspect-ratio: 6 / 5;
            background-color: #000;
        }

        /* Cada tarjeta: borde blanco, esquinas redondeadas, overflow oculto */
        .grid-item {
            border: 3px solid #fff;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Imagen: ocupa todo el espacio, mantiene proporción, sin espacio extra */
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Posicionamiento de cada elemento en el grid */
        .item1 {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
        }
        .item2 {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
        }
        .item3 {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
        }
        .item4 {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
        }
        .item5 {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
        }
        .item6 {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
        }
        .item7 {
            grid-column: 3 / 4;
            grid-row: 3 / 4;
        }

        /* Ajustes para pantallas muy pequeñas */
        @media (max-width: 600px) {
            .grid-container {
                gap: 5px;
            }
            .grid-item {
                border-width: 2px;
            }
        }
    </style>
</head>

<body>
    <!-- Botón Volver (se mantiene igual) -->
    <a href="../03-css/index.html" class="home-button">
        <span class="home-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </span>
        <span class="home-text">Volver</span>
    </a>

    <main>
        <!-- Encabezado (se mantiene igual) -->
        <header>
            <h1>45-challenge-grid</h1>
            <h2>Irregular Gallery.</h2>
        </header>

        <section>
            <!-- Contenido reemplazado: nuevo grid -->
            <div class="recuadro">
                <div class="grid-container">
                    <div class="grid-item item1">
                        <img src="../src/imgs/damami.jpg" alt="Imagen 1">
                    </div>
                    <div class="grid-item item2">
                        <img src="../src/imgs/pidiendoque.jpg" alt="Imagen 2">
                    </div>
                    <div class="grid-item item3">
                        <img src="../src/imgs/Captura de pantalla 2026-07-23 090522.png" alt="Imagen 3">
                    </div>
                    <div class="grid-item item4">
                        <img src="../src/imgs/bromas.jpeg" alt="Imagen 4">
                    </div>
                    <div class="grid-item item5">
                        <img src="../src/imgs/ramongus.jpeg" alt="Imagen 5">
                    </div>
                    <div class="grid-item item6">
                        <img src="../src/imgs/polo polo.jpg" alt="Imagen 6">
                    </div>
                    <div class="grid-item item7">
                        <img src="../src/imgs/viejapendeja.jpg" alt="Imagen 7">
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
