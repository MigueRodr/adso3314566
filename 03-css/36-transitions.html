<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36 - transitions</title>
    <link rel="stylesheet" href="../03-css/style.css">

 <style>
    main section {
        img {
            border: none;
            border-radius: 0;
            filter: drop-shadow(0 0 12px #fff);
        }
        img.transition01 {
            transition: transform 0.5s ease-in;
            &:hover {
                transform: scale(1.3);
            }
        }
        img.transition02 {
            transition: transform 0.5s ease-out;
            &:hover {
                transform: rotate(-0.5turn);
            }
        }
        img.transition03 {
            transition: transform 0.5s ease-in-out;
            &:hover {
                transform: rotateY(180deg);
            }
        }
        img.transition04 {
            transition: transform 0.5s linear;
            &:hover {
                transform: translateX(80px);
            }
        }

        .contenedor-padre {
       display: flex;
       justify-content: center; /* Centra horizontalmente */
       align-items: center;     /* Centra verticalmente */
        }
          div.box{
            
            background-color: #fff;
            height: 80px;
            margin-block: 2rem;
            width: 80px;
            transition: width 1s,
               height 1s 1s,
               background-color 1s 2s;

               &:hover{
                background-color: #8B6BD9;
                width: 300px;
                height: 160px;
               }
          }
</style>
</head>
<body>
    <main class="document-page"> 
      <a href="../03-css/index.html" class="home-button">
        <span class="home-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        <span class="home-text">Volver</span>
     </a>
        <header>
            <h1>36- Transitions</h1>
            <h2>Enable you to define the transition between two states of an element..</h2>
        </header>
        <section>
             <div class="recuadro">
            <h3>Scale(1. 4)</h3>
            <img class="transition01" src="../src/imgs/dk.png"  alt="DK">
            <h3>Rotate(-180deg):</h3>
            <img class="transition02" src="../src/imgs/dk.png" alt="DK">
            <h3>RotateY(180deg):</h3>
            <img class="transition03" src="../src/imgs/dk.png" alt="DK">
            <h3>TranslateX(100px):</h3>
            <img class="transition04" src="../src/imgs/dk.png" alt="DK">
            <h3>Multiple:</h3>
            <div class="contenedor-padre">
            <div class="box"></div>
            </div>
        </section>
    </main>
</body>
</html>
