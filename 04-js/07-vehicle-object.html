<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamaha | Selector de Motos</title>
<link rel="stylesheet" href="../04-js/css/style.css">
<style>
  * { box-sizing: border-box; }

  #vehicle {
    --card-bg: #ffffff;
    --card-border: #e5e9ed;
    --ink: #13171a;
    --ink-soft: #6b7683;
    --accent: #0033a0;
    --box-bg: #f4f6f8;
    --box-border: #e5e9ed;
    --btn-bg: #ffffff;
    --btn-border: #e5e9ed;
    --btn-ink: #13171a;
    --shadow: 0 18px 40px rgba(19,23,26,.10);
    --scene-bg: #87c5ec;
  }

  #vehicle.dark {
    --card-bg: #05080a;
    --card-border: #1a2026;
    --ink: #f4f6f8;
    --ink-soft: #8a949e;
    --accent: #4a7de0;
    --box-bg: #0d1216;
    --box-border: #1e252c;
    --btn-bg: #0d1216;
    --btn-border: #1e252c;
    --btn-ink: #f4f6f8;
    --shadow: 0 18px 40px rgba(0,0,0,.6);
    --scene-bg: #030610;
  }

  #vehicle {
    color: var(--ink) !important;
    width: 380px;
    max-width: 100%;
    margin: 0 auto;
    background: var(--card-bg) !important;
    border-radius: 22px;
    padding: 20px;
    box-shadow: var(--shadow);
    transition: background .35s ease, color .35s ease;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    isolation: isolate;
    position: relative;
    z-index: 1;
  }

  /* ══════════════════════════════════════════════════════════════
     KILLER TOTAL — mata TODA posibilidad de dorado
     ══════════════════════════════════════════════════════════════ */
  #vehicle,
  #vehicle * {
    text-shadow: none !important;
    -webkit-text-stroke: 0 !important;
    -webkit-text-stroke-width: 0 !important;
    -webkit-text-stroke-color: transparent !important;
    text-decoration: none !important;
    outline: none !important;
    filter: none !important;
    -webkit-filter: none !important;
    border-image: none !important;
    border-image-source: none !important;
    border-image-slice: 0 !important;
    border-image-width: 0 !important;
    border-image-outset: 0 !important;
    border-image-repeat: stretch !important;
  }

  /* Mata pseudo-elementos en todo el mockup */
  #vehicle *::before,
  #vehicle *::after {
    content: none !important;
    display: none !important;
    background: none !important;
    border: none !important;
    box-shadow: none !important;
    width: 0 !important;
    height: 0 !important;
  }

  /* Texto — sin gradientes, sin strokes */
  #vehicle p,
  #vehicle span,
  #vehicle h1,
  #vehicle h2,
  #vehicle h3 {
    color: inherit !important;
    -webkit-text-fill-color: inherit !important;
    background: none !important;
    background-image: none !important;
    background-color: transparent !important;
    background-clip: border-box !important;
    -webkit-background-clip: border-box !important;
    text-shadow: none !important;
    -webkit-text-stroke: 0 !important;
  }

  /* ══════════════════════════════════════════════════════════════
     BOTONES — bordes y colores 100% forzados
     ══════════════════════════════════════════════════════════════ */
  #vehicle button {
    box-sizing: border-box !important;
    cursor: pointer !important;
    font-family: inherit !important;
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
    user-select: none !important;
    -webkit-appearance: none !important;
    appearance: none !important;

    /* Forzar TODOS los lados del borde */
    border: 1px solid var(--btn-border) !important;
    border-top: 1px solid var(--btn-border) !important;
    border-right: 1px solid var(--btn-border) !important;
    border-bottom: 1px solid var(--btn-border) !important;
    border-left: 1px solid var(--btn-border) !important;
    border-color: var(--btn-border) !important;
    border-style: solid !important;
    border-width: 1px !important;
    border-radius: inherit;

    /* Forzar fondo e imagen */
    background-color: var(--btn-bg) !important;
    background-image: none !important;
    background: var(--btn-bg) !important;

    /* Forzar color del texto */
    color: var(--btn-ink) !important;
    -webkit-text-fill-color: var(--btn-ink) !important;

    /* Sin sombras ni efectos externos */
    box-shadow: none !important;
    text-shadow: none !important;
    -webkit-text-stroke: 0 !important;
  }

  /* Hover — azul Yamaha */
  #vehicle menu button:hover,
  #vehicle button.mode:hover,
  #vehicle button.nav-arrow:hover {
    border-color: var(--accent) !important;
    border-top-color: var(--accent) !important;
    border-right-color: var(--accent) !important;
    border-bottom-color: var(--accent) !important;
    border-left-color: var(--accent) !important;
    box-shadow: 0 6px 14px rgba(0, 51, 160, .18) !important;
    background-color: var(--btn-bg) !important;
    background-image: none !important;
    color: var(--btn-ink) !important;
    -webkit-text-fill-color: var(--btn-ink) !important;
  }
  #vehicle.dark menu button:hover {
    box-shadow: 0 6px 14px rgba(74, 125, 224, .25) !important;
  }

  /* Focus / active — sin dorados */
  #vehicle button:focus,
  #vehicle button:focus-visible,
  #vehicle button:active {
    outline: none !important;
    box-shadow: none !important;
    border-color: var(--btn-border) !important;
    border-top-color: var(--btn-border) !important;
    border-right-color: var(--btn-border) !important;
    border-bottom-color: var(--btn-border) !important;
    border-left-color: var(--btn-border) !important;
  }
  #vehicle button::-moz-focus-inner { border: 0 !important; }

  /* SVG del botón — forzado */
  #vehicle button svg,
  #vehicle button svg * {
    stroke: var(--btn-ink) !important;
    color: var(--btn-ink) !important;
    fill: none !important;
    -webkit-text-stroke: 0 !important;
    text-shadow: none !important;
    border: none !important;
    box-shadow: none !important;
    filter: none !important;
  }
  #vehicle button svg path,
  #vehicle button svg circle,
  #vehicle button svg rect,
  #vehicle button svg line,
  #vehicle button svg polyline,
  #vehicle button svg polygon {
    stroke: var(--btn-ink) !important;
    fill: none !important;
  }

  /* SPAN del botón — texto forzado, sin dorados */
  #vehicle button span,
  #vehicle menu button span {
    color: var(--btn-ink) !important;
    -webkit-text-fill-color: var(--btn-ink) !important;
    background: none !important;
    background-image: none !important;
    background-color: transparent !important;
    background-clip: border-box !important;
    -webkit-background-clip: border-box !important;
    text-shadow: none !important;
    -webkit-text-stroke: 0 !important;
    -webkit-text-stroke-width: 0 !important;
    -webkit-text-stroke-color: transparent !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
    filter: none !important;
  }

  /* HEADER */
  #vehicle > header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }
  .header-spacer { display: block; }
  .yamaha-wordmark {
    grid-column: 2;
    height: 56px;
    width: auto;
    max-width: 240px;
    object-fit: contain;
    justify-self: center;
  }
  button.mode {
    grid-column: 3;
    justify-self: end;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: .78rem;
    font-weight: 700;
    transition: transform .2s ease;
  }
  button.mode:hover { transform: translateY(-1px); }
  button.mode svg {
    width: 17px; height: 17px;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* NAV */
  nav.selector {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 18px;
  }
  button.nav-arrow {
    display: inline-flex !important;
    align-items: center !important;
    gap: 5px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: .8rem;
    font-weight: 700;
    flex-shrink: 0;
    transition: transform .2s ease;
  }
  button.nav-arrow:hover { transform: translateY(-1px); }
  button.nav-arrow svg {
    width: 15px; height: 15px;
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .brand {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding: 0 6px;
  }
  .brand-name-img {
    height: 30px;
    width: auto;
    max-width: 190px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  /* SPECS */
  .specs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 16px;
  }
  .spec-box {
    background: var(--box-bg) !important;
    background-image: none !important;
    border: 1px solid var(--box-border) !important;
    border-radius: 12px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: none !important;
    transition: border-color .3s ease, background .3s ease;
  }
  .spec-box:hover { border-color: var(--accent) !important; }
  #vehicle.dark .spec-box:first-child { border-color: var(--accent) !important; }
  .spec-head {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .spec-head svg {
    width: 16px; height: 16px;
    stroke: var(--ink) !important;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .spec-label {
    margin: 0;
    font-size: .72rem;
    font-weight: 700;
    color: var(--ink) !important;
    -webkit-text-fill-color: var(--ink) !important;
  }
  .spec-value {
    margin: 0;
    font-size: .82rem;
    font-weight: 800;
    color: var(--accent) !important;
    -webkit-text-fill-color: var(--accent) !important;
    padding-left: 2px;
  }

  /* ESCENA */
  .scene-container {
    position: relative;
    width: 100%;
    height: 220px;
    margin-top: 16px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--card-border) !important;
    background: var(--scene-bg) !important;
    box-shadow: none !important;
    transition: background .35s ease, border-color .35s ease;
  }
  .layer {
    position: absolute;
    left: 0; right: 0;
    background-repeat: repeat-x;
    background-size: auto 100%;
    will-change: background-position;
    pointer-events: none;
    animation-play-state: paused;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .layer-sky {
    inset: 0;
    background-position: 0 50%;
    animation-name: scroll-bg;
    animation-duration: 100s;
  }
  .layer-mountains {
    bottom: 22%;
    height: 70%;
    background-position: 0 100%;
    animation-name: scroll-bg;
    animation-duration: 30s;
  }
  .layer-road {
    bottom: 0;
    height: 34%;
    background-position: 0 100%;
    animation-name: scroll-bg;
    animation-duration: 3s;
  }
  .scene-container.is-forward .layer {
    animation-play-state: running;
    animation-direction: normal;
  }
  .scene-container.is-forward .layer-sky       { animation-duration: 30s; }
  .scene-container.is-forward .layer-mountains { animation-duration: 9s; }
  .scene-container.is-forward .layer-road      { animation-duration: 0.9s; }

  .scene-container.is-back .layer {
    animation-play-state: running;
    animation-direction: reverse;
  }
  .scene-container.is-back .layer-sky       { animation-duration: 150s; }
  .scene-container.is-back .layer-mountains { animation-duration: 45s; }
  .scene-container.is-back .layer-road      { animation-duration: 5s; }

  @keyframes scroll-bg {
    from { background-position-x: 0; }
    to   { background-position-x: -1855px; }
  }
  .scene-container::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.10) 0%, transparent 42%);
    pointer-events: none;
    z-index: 1;
  }

  /* MOTO */
  .moto-img {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    max-width: 70%;
    max-height: 74%;
    object-fit: contain;
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,.35));
    transform-origin: 50% 95%;
    transition: transform .85s cubic-bezier(.34,1.4,.5,1);
  }
  @keyframes moto-bob {
    0%   { transform: translateX(-50%) translateY(0)     rotate(0deg); }
    25%  { transform: translateX(-50%) translateY(-2px)  rotate(-.6deg); }
    50%  { transform: translateX(-50%) translateY(-5px)  rotate(0deg); }
    75%  { transform: translateX(-50%) translateY(-2px)  rotate(.6deg); }
    100% { transform: translateX(-50%) translateY(0)     rotate(0deg); }
  }
  .moto-img.is-running {
    animation: moto-bob .8s ease-in-out infinite;
    transition: none;
  }
  .moto-img.is-stunt {
    transform: translateX(-42%) translateY(-18%) rotate(-75deg);
    transform-origin: 22% 95%;
    filter: drop-shadow(-6px 10px 10px rgba(0,0,0,.45));
    animation: none !important;
    max-height: 90%;
    bottom: 4%;
  }

  /* MENÚ */
  menu {
    display: grid !important;
    grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
    gap: 6px !important;
    margin: 16px 0 0 !important;
    padding: 0 !important;
    list-style: none !important;
    width: 100% !important;
    background: transparent !important;
  }
  menu button {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 4px !important;
    width: 100% !important;
    height: 60px !important;
    padding: 5px 2px !important;
    border-radius: 10px !important;
    font-size: .6rem !important;
    font-weight: 700 !important;
    letter-spacing: .2px !important;
    line-height: 1 !important;
    text-align: center !important;
    min-width: 0 !important;
    overflow: hidden !important;
    transition: transform .18s ease, background-color .25s ease,
                border-color .25s ease, color .25s ease, box-shadow .25s ease !important;
  }
  menu button svg {
    width: 20px !important;
    height: 20px !important;
    flex-shrink: 0 !important;
    fill: none !important;
    stroke-width: 2 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    transition: stroke .25s ease !important;
  }
  menu button span {
    display: block !important;
    width: 100% !important;
    text-align: center !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
    font-size: .6rem !important;
    font-weight: 700 !important;
    line-height: 1 !important;
  }

  /* Estado activo */
  menu button.active {
    background-color: var(--accent) !important;
    background-image: none !important;
    border-color: var(--accent) !important;
    border-top-color: var(--accent) !important;
    border-right-color: var(--accent) !important;
    border-bottom-color: var(--accent) !important;
    border-left-color: var(--accent) !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
    box-shadow: 0 6px 14px rgba(0, 51, 160, .28) !important;
  }
  menu button.active:hover {
    background-color: var(--accent) !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
  }
  #vehicle.dark menu button.active {
    box-shadow: 0 6px 14px rgba(74, 125, 224, .4) !important;
  }
  menu button.active svg,
  menu button.active svg * {
    stroke: #ffffff !important;
    color: #ffffff !important;
  }
  menu button.active span {
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
  }
</style>
</head>
<body>

<a href="../04-js/index.html" class="home-button">
  <span class="home-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <span class="home-text">Volver</span>
</a>

<main>
  <header>
    <h1>07 - Vehicle Object</h1>
    <h2>Create and manipulate a vehicle object with properties.</h2>
  </header>

  <section>
    <div class="recuadro">
      <div id="vehicle">
        <header>
          <span class="header-spacer"></span>
          <img id="logoHeader" src="../04-js/imgs/logo-white.png" class="yamaha-wordmark" alt="Yamaha">
          <button class="mode" id="modeToggle" aria-label="Cambiar modo claro/oscuro">
            <svg id="modeIcon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4.5"></circle>
              <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>
            </svg>
            <span>Mode</span>
          </button>
        </header>

        <nav class="selector">
          <button class="nav-arrow" id="prevBtn" aria-label="Moto anterior">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            <span>Prev</span>
          </button>
          <div class="brand">
            <img id="logoNav" src="../04-js/imgs/logo-white.png" class="brand-name-img" alt="YAMAHA">
          </div>
          <button class="nav-arrow" id="nextBtn" aria-label="Moto siguiente">
            <span>Next</span>
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </nav>

        <div class="specs">
          <div class="spec-box">
            <div class="spec-head">
              <svg viewBox="0 0 24 24">
                <circle cx="5.5" cy="17" r="3"/>
                <circle cx="18.5" cy="17" r="3"/>
                <path d="M5.5 17l4-8h5l1 3h3l2 5"/>
                <path d="M14 12h-3l-1.5 3"/>
              </svg>
              <p class="spec-label">Model</p>
            </div>
            <p class="spec-value" id="specModel">YZ450F</p>
          </div>

          <div class="spec-box">
            <div class="spec-head">
              <svg viewBox="0 0 24 24">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                <circle cx="7" cy="7" r="1.4"/>
              </svg>
              <p class="spec-label">Refer</p>
            </div>
            <p class="spec-value" id="specRefer">2024</p>
          </div>

          <div class="spec-box">
            <div class="spec-head">
              <svg viewBox="0 0 24 24">
                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C21.97 6.01 17.46 2 12 2z"/>
                <circle cx="13.5" cy="6.5" r=".6" fill="currentColor" stroke="none"/>
                <circle cx="17.5" cy="10.5" r=".6" fill="currentColor" stroke="none"/>
                <circle cx="8.5" cy="7.5" r=".6" fill="currentColor" stroke="none"/>
                <circle cx="6.5" cy="12.5" r=".6" fill="currentColor" stroke="none"/>
              </svg>
              <p class="spec-label">Color</p>
            </div>
            <p class="spec-value" id="specColor">Yamaha Blue</p>
          </div>
        </div>

        <div class="scene-container" id="scene">
          <div class="layer layer-sky" id="layerSky"></div>
          <div class="layer layer-mountains" id="layerMountains"></div>
          <div class="layer layer-road" id="layerRoad"></div>
          <img class="moto-img" id="motoImg" src="" alt="Moto seleccionada">
        </div>

        <menu>
          <button class="active" id="menuOn" title="Encender">
            <svg viewBox="0 0 24 24">
              <path d="M12 3v9"/>
              <path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
            </svg>
            <span>On</span>
          </button>

          <button id="menuNext" title="Avanzar">
            <svg viewBox="0 0 24 24">
              <path d="M6 17l6-5-6-5"/>
              <path d="M13 17l6-5-6-5"/>
            </svg>
            <span>Forw</span>
          </button>

          <button id="menuStop" title="Detener">
            <svg viewBox="0 0 24 24">
              <rect x="6" y="6" width="12" height="12" rx="1.5"/>
            </svg>
            <span>Stop</span>
          </button>

          <button id="menuPrev" title="Retroceder">
            <svg viewBox="0 0 24 24">
              <path d="M18 17l-6-5 6-5"/>
              <path d="M11 17l-6-5 6-5"/>
            </svg>
            <span>Back</span>
          </button>

          <button id="menuOff" title="Apagar motor">
            <svg viewBox="0 0 24 24">
              <path d="M12 3v9"/>
              <path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>
            </svg>
            <span>Off</span>
          </button>

          <button id="menuStunt" title="Hacer caballito">
            <svg viewBox="0 0 24 24">
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="7" r="3"/>
              <path d="M6 18 L11 13 L18 7"/>
              <path d="M15 5 L21 9"/>
            </svg>
            <span>Stunt</span>
          </button>
        </menu>
      </div>
    </div>
  </section>
</main>

<script>
  const LOGO_LIGHT = '../04-js/imgs/logo-white.png';
  const LOGO_DARK  = '../04-js/imgs/yamahablack.png';

  const SCENE_DAY = {
    sky:       '../04-js/imgs/cielo_dia.png',
    mountains: '../04-js/imgs/montanas_dia.png',
    road:      '../04-js/imgs/carretera_dia.png'
  };
  const SCENE_NIGHT = {
    sky:       '../04-js/imgs/cielo_noche.png',
    mountains: '../04-js/imgs/montanas_noche.png',
    road:      '../04-js/imgs/carretera_noche.png'
  };

  const motos = [
    { name:'YZ450F', refer:'2024', color:'Yamaha Blue',
      img:'../04-js/imgs/yz.png',
      audioStart: '../04-js/audio/yz450f_arranque.wav',
      audioRun:   '../04-js/audio/yz450f_andar.wav' },
    { name:'MT-07', refer:'2024', color:'Icon Blue',
      img:'../04-js/imgs/mt07.png',
      audioStart: '../04-js/audio/mt07_arranque.wav',
      audioRun:   '../04-js/audio/mt07_andar.wav' },
    { name:'MT-09', refer:'2024', color:'Icon Blue',
      img:'../04-js/imgs/mt09.png',
      audioStart: '../04-js/audio/mt09_arranque.wav',
      audioRun:   '../04-js/audio/mt09_andar.wav' },
    { name:'NMAX 155', refer:'2024', color:'Yamaha Blue',
      img:'../04-js/imgs/nmax.png',
      audioStart: '../04-js/audio/nmax_arranque.wav',
      audioRun:   '../04-js/audio/nmax_andar.wav' },
    { name:'DT 175', refer:'2024', color:'Yamaha Blue',
      img:'../04-js/imgs/dt175.png',
      audioStart: '../04-js/audio/dt175_arranque.wav',
      audioRun:   '../04-js/audio/dt175_andar.wav' }
  ];

  let current = 0;
  let engineOn = false;
  let stuntActive = false;

  const vhc        = document.getElementById('vehicle');
  const modeToggle = document.getElementById('modeToggle');
  const modeIcon   = document.getElementById('modeIcon');
  const logoHeader = document.getElementById('logoHeader');
  const logoNav    = document.getElementById('logoNav');
  const prevBtn    = document.getElementById('prevBtn');
  const nextBtn    = document.getElementById('nextBtn');
  const specModel  = document.getElementById('specModel');
  const specRefer  = document.getElementById('specRefer');
  const specColor  = document.getElementById('specColor');
  const motoImg    = document.getElementById('motoImg');
  const scene      = document.getElementById('scene');
  const layerSky   = document.getElementById('layerSky');
  const layerMtn   = document.getElementById('layerMountains');
  const layerRoad  = document.getElementById('layerRoad');
  const menuPrev   = document.getElementById('menuPrev');
  const menuNext   = document.getElementById('menuNext');
  const menuStop   = document.getElementById('menuStop');
  const menuOn     = document.getElementById('menuOn');
  const menuOff    = document.getElementById('menuOff');
  const menuStunt  = document.getElementById('menuStunt');

  /* ═══════════════════════════════════════════════════════════════
     AUDIO — sin timeout que corta, con logs claros
     ═══════════════════════════════════════════════════════════════ */
  let startAudio = null;
  let runAudio   = null;
  let currentRunSrc = '';
  let audioSession = 0;
  let durationTimer = null;

  function clearDurationTimer(){
    if (durationTimer){
      clearTimeout(durationTimer);
      durationTimer = null;
    }
  }

  function stopAllAudio(){
    audioSession++;
    clearDurationTimer();
    currentRunSrc = '';
    if (startAudio){
      try { startAudio.pause(); startAudio.currentTime = 0; startAudio.src = ''; startAudio.load(); } catch(e){}
      startAudio = null;
    }
    if (runAudio){
      try { runAudio.pause(); runAudio.currentTime = 0; runAudio.src = ''; runAudio.load(); } catch(e){}
      runAudio = null;
    }
  }

  function stopStartOnly(){
    clearDurationTimer();
    if (startAudio){
      try { startAudio.pause(); startAudio.currentTime = 0; startAudio.src = ''; startAudio.load(); } catch(e){}
      startAudio = null;
    }
  }

  // Loop de andar — sin reiniciar si ya está sonando el mismo archivo
  function ensureRunAudio(moto, rate){
    if (!moto.audioRun){
      console.warn('[Audio] No hay audioRun para', moto.name);
      return;
    }

    if (runAudio && currentRunSrc === moto.audioRun){
      runAudio.playbackRate = rate || 1.0;
      if (runAudio.paused) runAudio.play().catch(()=>{});
      return;
    }

    if (runAudio){
      try { runAudio.pause(); runAudio.src = ''; runAudio.load(); } catch(e){}
      runAudio = null;
    }

    runAudio = new Audio();
    runAudio.src = moto.audioRun;
    runAudio.loop = true;
    runAudio.volume = 0.85;
    runAudio.playbackRate = rate || 1.0;
    currentRunSrc = moto.audioRun;

    runAudio.addEventListener('canplaythrough', () => {
      console.log('[Audio] ✓ Loop listo:', moto.audioRun);
    });
    runAudio.addEventListener('error', (e) => {
      console.error('[Audio] ✗ ERROR cargando loop:', moto.audioRun, e);
    });

    runAudio.play()
      .then(() => console.log('[Audio] ▶ Loop reproduciendo'))
      .catch(err => console.error('[Audio] ✗ play() falló:', err));
  }

  // ON → arranque + luego loop (usa duración real del archivo)
  function playEngine(moto){
    stopAllAudio();
    const mySession = audioSession;

    if (!moto.audioStart){
      ensureRunAudio(moto, 1.0);
      return;
    }

    startAudio = new Audio();
    startAudio.src = moto.audioStart;
    startAudio.volume = 0.85;

    let runStarted = false;
    const startRun = (source) => {
      if (runStarted) return;
      runStarted = true;
      if (audioSession !== mySession) return;
      console.log('[Audio] Arranque finalizó por:', source);
      stopStartOnly();
      ensureRunAudio(moto, 1.0);
    };

    // Solo cuando termine de verdad
    startAudio.addEventListener('ended', () => startRun('ended'));

    // Cuando sepamos la duración real, ponemos un respaldo
    startAudio.addEventListener('loadedmetadata', () => {
      const dur = startAudio.duration;
      if (isFinite(dur) && dur > 0){
        clearDurationTimer();
        durationTimer = setTimeout(() => {
          if (audioSession !== mySession) return;
          startRun('duration-fallback');
        }, Math.ceil(dur * 1000) + 400);   // duración + 400ms
      }
    });

    startAudio.addEventListener('error', () => startRun('error'));
    startAudio.play().catch(err => {
      console.warn('[Audio] Arranque no se pudo reproducir:', err);
      startRun('play-catch');
    });
  }

  function setRunRate(rate){ if (runAudio) runAudio.playbackRate = rate; }

  /* RENDER */
  function render(){
    const m = motos[current];
    specModel.textContent = m.name;
    specRefer.textContent = m.refer;
    specColor.textContent = m.color;
    motoImg.src = m.img;
    motoImg.alt = m.name;
  }

  function applySceneImages(isDark){
    const s = isDark ? SCENE_NIGHT : SCENE_DAY;
    layerSky.style.backgroundImage  = `url('${s.sky}')`;
    layerMtn.style.backgroundImage  = `url('${s.mountains}')`;
    layerRoad.style.backgroundImage = `url('${s.road}')`;
  }

  function clearSceneState(){
    scene.classList.remove('is-forward', 'is-back');
  }

  function setActive(btn){
    [menuOn, menuNext, menuStop, menuPrev, menuOff, menuStunt].forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
  }

  function cancelStunt(){
    if (stuntActive){
      stuntActive = false;
      motoImg.classList.remove('is-stunt');
    }
  }

  /* BOTONES */
  function turnOn(){
    cancelStunt();
    engineOn = true;
    motoImg.classList.add('is-running');
    clearSceneState();
    playEngine(motos[current]);
    setActive(menuOn);
  }

  function turnOff(){
    cancelStunt();
    engineOn = false;
    motoImg.classList.remove('is-running');
    clearSceneState();
    stopAllAudio();
    setActive(menuOff);
  }

  function goForward(){
    cancelStunt();
    engineOn = true;
    motoImg.classList.add('is-running');
    clearSceneState();
    scene.classList.add('is-forward');
    stopStartOnly();
    ensureRunAudio(motos[current], 1.0);
    setActive(menuNext);
  }

  function goBack(){
    cancelStunt();
    engineOn = true;
    motoImg.classList.add('is-running');
    clearSceneState();
    scene.classList.add('is-back');
    stopStartOnly();
    ensureRunAudio(motos[current], 1.0);
    setActive(menuPrev);
  }

  function goStop(){
    cancelStunt();
    engineOn = true;
    motoImg.classList.remove('is-running');
    clearSceneState();
    stopStartOnly();
    ensureRunAudio(motos[current], 0.65);
    setActive(menuStop);
  }

  function toggleStunt(){
    stuntActive = !stuntActive;

    if (stuntActive){
      motoImg.classList.add('is-stunt');
      motoImg.classList.remove('is-running');
      clearSceneState();
      scene.classList.add('is-forward');
      stopStartOnly();
      ensureRunAudio(motos[current], 0.9);
      setActive(menuStunt);
    } else {
      motoImg.classList.remove('is-stunt');
      if (engineOn) motoImg.classList.add('is-running');
      scene.classList.remove('is-forward');
      setActive(engineOn ? menuOn : menuOff);
    }
  }

  /* NAVEGACIÓN */
  function restartEngineIfOn(){
    if (!engineOn) return;
    stopAllAudio();
    setTimeout(() => {
      if (engineOn) playEngine(motos[current]);
    }, 200);
  }
  function goPrevModel(){
    cancelStunt();
    current = (current - 1 + motos.length) % motos.length;
    render();
    restartEngineIfOn();
  }
  function goNextModel(){
    cancelStunt();
    current = (current + 1) % motos.length;
    render();
    restartEngineIfOn();
  }

  prevBtn.addEventListener('click', goPrevModel);
  nextBtn.addEventListener('click', goNextModel);

  menuOn.addEventListener('click', turnOn);
  menuOff.addEventListener('click', turnOff);
  menuNext.addEventListener('click', goForward);
  menuPrev.addEventListener('click', goBack);
  menuStop.addEventListener('click', goStop);
  menuStunt.addEventListener('click', toggleStunt);

  /* TEMA */
  function setTheme(isDark){
    vhc.classList.toggle('dark', isDark);
    logoHeader.src = isDark ? LOGO_DARK : LOGO_LIGHT;
    logoNav.src    = isDark ? LOGO_DARK : LOGO_LIGHT;
    applySceneImages(isDark);

    modeIcon.innerHTML = isDark
      ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor" stroke="none"></path>'
      : '<circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>';
  }

  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  setTheme(darkQuery.matches);
  darkQuery.addEventListener('change', e => setTheme(e.matches));
  modeToggle.addEventListener('click', () => setTheme(!vhc.classList.contains('dark')));

  render();
</script>
</body>
</html>
