<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamaha | Selector de Motos</title>
<link rel="stylesheet" href="../04-js/css/style.css">
<style>
  * { box-sizing: border-box; }

  :root {
    --bg-page: #ffffff;
    --card-bg: #ffffff;
    --card-border: #e5e9ed;
    --ink: #13171a;
    --ink-soft: #6b7683;
    --accent: #0033a0;
    --accent-2: #e30613;

    --box-bg: #f4f6f8;
    --box-border: #e5e9ed;

    --btn-bg: #ffffff;
    --btn-border: #e5e9ed;

    --shadow: 0 18px 40px rgba(19,23,26,.10);
    --scene-bg: #87c5ec;
  }

  #vehicle.dark {
    --bg-page: #05080a;
    --card-bg: #05080a;
    --card-border: #1a2026;
    --ink: #f4f6f8;
    --ink-soft: #8a949e;
    --accent: #4a7de0;
    --accent-2: #ff5c6c;

    --box-bg: #0d1216;
    --box-border: #1e252c;

    --btn-bg: #0d1216;
    --btn-border: #1e252c;

    --shadow: 0 18px 40px rgba(0,0,0,.6);
    --scene-bg: #030610;
  }




  #vehicle {
    width: 380px;
    max-width: 100%;
    background: var(--card-bg);
    border-radius: 22px;
    padding: 20px;
    transition: background .35s ease;
  }

  /* HEADER */
  #vehicle > header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }
  .header-spacer { display: block; }
  .yamaha-wordmark {
    grid-column: 2;
    height: 46px;
    width: auto;
    max-width: 190px;
    object-fit: contain;
    justify-self: center;
  }
  button.mode {
    grid-column: 3;
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--ink);
    font-size: .78rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .2s ease, background .3s ease, border-color .3s ease;
  }

  button.mode:hover { transform: translateY(-1px); border-color: var(--accent); }
  button.mode svg {
    width: 17px; height: 17px;
    stroke: var(--ink);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* NAV */
  nav.selector {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 18px;
  }
  button.nav-arrow {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--ink);
    font-size: .8rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  button.nav-arrow:hover {
    background: var(--box-bg);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  button.nav-arrow svg {
    width: 14px; height: 14px;
    stroke: var(--ink);
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .brand {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }
  .brand-name-img {
    height: 24px;
    width: auto;
    max-width: 150px;
    object-fit: contain;
  }

  /* SPECS */
  .specs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 16px;
  }
  .spec-box {
    background: var(--box-bg);
    border: 1px solid var(--box-border);
    border-radius: 12px;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .3s ease, background .3s ease;
  }
  .spec-box:hover { border-color: var(--accent); }
  #vehicle.dark .spec-box:first-child { border-color: var(--accent); }
  .spec-head {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .spec-head svg {
    width: 16px; height: 16px;
    stroke: var(--ink);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .spec-label {
    margin: 0;
    font-size: .72rem;
    font-weight: 700;
    color: var(--ink);
  }
  .spec-value {
    margin: 0;
    font-size: .82rem;
    font-weight: 800;
    color: var(--accent);
    padding-left: 2px;
  }

  /* ══════════════════════════════════════════════════════════════
     ESCENA — capas SIN background-image en CSS
     Las imágenes se asignan desde JS según el tema
     ══════════════════════════════════════════════════════════════ */
  .scene-container {
    position: relative;
    width: 100%;
    height: 220px;
    margin-top: 16px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    background: var(--scene-bg);
    transition: background .35s ease, border-color .35s ease;
  }

  .layer {
    position: absolute;
    left: 0; right: 0;
    background-repeat: repeat-x;
    background-size: auto 100%;
    will-change: background-position;
    pointer-events: none;
    animation-play-state: paused;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .layer-sky {
    inset: 0;
    background-position: 0 50%;
    animation-name: scroll-bg;
    animation-duration: 100s;
  }
  .layer-mountains {
    bottom: 22%;
    height: 70%;
    background-position: 0 100%;
    animation-name: scroll-bg;
    animation-duration: 30s;
  }
  .layer-road {
    bottom: 0;
    height: 34%;
    background-position: 0 100%;
    animation-name: scroll-bg;
    animation-duration: 3s;
  }

  /* Estados de la escena */
  .scene-container.is-forward .layer {
    animation-play-state: running;
    animation-direction: normal;
  }
  .scene-container.is-forward .layer-sky       { animation-duration: 30s; }
  .scene-container.is-forward .layer-mountains { animation-duration: 9s; }
  .scene-container.is-forward .layer-road      { animation-duration: 0.9s; }

  .scene-container.is-back .layer {
    animation-play-state: running;
    animation-direction: reverse;
  }
  .scene-container.is-back .layer-sky       { animation-duration: 150s; }
  .scene-container.is-back .layer-mountains { animation-duration: 45s; }
  .scene-container.is-back .layer-road      { animation-duration: 5s; }

  @keyframes scroll-bg {
    from { background-position-x: 0; }
    to   { background-position-x: -1855px; }
  }

  .scene-container::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.10) 0%, transparent 42%);
    pointer-events: none;
    z-index: 1;
  }

  /* MOTO */
  .moto-img {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    max-width: 78%;
    max-height: 82%;
    object-fit: contain;
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,.35));
  }

  @keyframes moto-bob {
    0%   { transform: translateX(-50%) translateY(0)     rotate(0deg); }
    25%  { transform: translateX(-50%) translateY(-2px)  rotate(-.6deg); }
    50%  { transform: translateX(-50%) translateY(-5px)  rotate(0deg); }
    75%  { transform: translateX(-50%) translateY(-2px)  rotate(.6deg); }
    100% { transform: translateX(-50%) translateY(0)     rotate(0deg); }
  }
  .moto-img.is-running {
    animation: moto-bob .8s ease-in-out infinite;
  }

  /* MENÚ */
  menu {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 6px;
    margin: 16px 0 0;
    padding: 0;
    list-style: none;
    width: 100%;
  }
  menu button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 9px 2px 7px;
    border-radius: 10px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--ink);
    font-size: .68rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 0;
    overflow: hidden;
    transition: transform .2s ease, background .2s ease, border-color .2s ease, color .2s ease;
  }
  menu button:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  menu button span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    line-height: 1;
  }
  menu button svg {
    width: 20px; height: 20px;
    stroke: var(--ink);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
    transition: stroke .2s ease;
  }
  menu button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  menu button.active svg { stroke: #fff; }
</style>
</head>

            <header>

            <section>
                <div class="recuadro">
                <div id="vehicle">
  <header>

<div id="vehicle">
  <header>
    <span class="header-spacer"></span>
    <img id="logoHeader" src="../04-js/imgs/yamahablack.png" class="yamaha-wordmark" alt="Yamaha">
    <button class="mode" id="modeToggle" aria-label="Cambiar modo claro/oscuro">

      </svg>
      <span>Mode</span>
    </button>

  <nav class="selector">

      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>

  <div class="specs">
    <div class="spec-box">
      <div class="spec-head">

          <circle cx="5.5" cy="17" r="3"/>
          <circle cx="18.5" cy="17" r="3"/>
          <path d="M5.5 17l4-8h5l1 3h3l2 5"/>

          <circle cx="13.5" cy="6.5" r=".6" fill="currentColor" stroke="none"/>
          <circle cx="17.5" cy="10.5" r=".6" fill="currentColor" stroke="none"/>
          <circle cx="8.5" cy="7.5" r=".6" fill="currentColor" stroke="none"/>
          <circle cx="6.5" cy="12.5" r=".6" fill="currentColor" stroke="none"/>

  <div class="scene-container" id="scene">
    <div class="layer layer-sky" id="layerSky"></div>

  <menu>

<script>
  /* ═══════════════════════════════════════════════════════════════
     RUTAS DE IMÁGENES
     ═══════════════════════════════════════════════════════════════ */
  const LOGO_LIGHT = '../04-js/imgs/logo-white.png';
  const LOGO_DARK  = '../04-js/imgs/yamahablack.png';

  // Escena DÍA (modo claro) → las imágenes que enviaste
  const SCENE_DAY = {
    sky:       '../04-js/imgs/cielo_dia.png',
    mountains: '../04-js/imgs/montanas_dia.png',
    road:      '../04-js/imgs/carretera_dia.png'
  };

  // Escena NOCHE (modo oscuro)
  const SCENE_NIGHT = {
    sky:       '../04-js/imgs/cielo_noche.png',
    mountains: '../04-js/imgs/montanas_noche.png',
    road:      '../04-js/imgs/carretera_noche.png'
  };

  /* ═══════════════════════════════════════════════════════════════
     DATOS DE LAS MOTOS
     ═══════════════════════════════════════════════════════════════ */
  const motos = [
    { name:'YZ450F',   refer:'2024', color:'Yamaha Blue',
      img:'../04-js/imgs/yz.png',
      engine: { freq:78, harmonic:2.4, puttRate:14, volume:0.28, roughness:0.55 } },
    { name:'MT-07',    refer:'2024', color:'Icon Blue',
      img:'../04-js/imgs/mt07.png',
      engine: { freq:58, harmonic:2.0, puttRate:10, volume:0.26, roughness:0.50 } },
    { name:'MT-09',    refer:'2024', color:'Icon Blue',
      img:'../04-js/imgs/mt09.png',
      engine: { freq:68, harmonic:2.6, puttRate:12, volume:0.26, roughness:0.45 } },
    { name:'NMAX 155', refer:'2024', color:'Yamaha Blue',
      img:'../04-js/imgs/nmax.png',
      engine: { freq:96, harmonic:1.9, puttRate:8,  volume:0.20, roughness:0.25 } },
    { name:'DT 175',   refer:'2024', color:'Yamaha Blue',
      img:'../04-js/imgs/dt175.png',
      engine: { freq:88, harmonic:3.2, puttRate:18, volume:0.26, roughness:0.75 } }
  ];

  let current = 0;
  let engineOn = false;

  const vhc          = document.getElementById('vehicle');
  const modeToggle   = document.getElementById('modeToggle');
  const modeIcon     = document.getElementById('modeIcon');
  const logoHeader   = document.getElementById('logoHeader');
  const logoNav      = document.getElementById('logoNav');
  const prevBtn      = document.getElementById('prevBtn');
  const nextBtn      = document.getElementById('nextBtn');
  const specModel    = document.getElementById('specModel');
  const specRefer    = document.getElementById('specRefer');
  const specColor    = document.getElementById('specColor');
  const motoImg      = document.getElementById('motoImg');
  const scene        = document.getElementById('scene');
  const layerSky     = document.getElementById('layerSky');
  const layerMtn     = document.getElementById('layerMountains');
  const layerRoad    = document.getElementById('layerRoad');
  const menuPrev     = document.getElementById('menuPrev');
  const menuNext     = document.getElementById('menuNext');
  const menuStop     = document.getElementById('menuStop');
  const menuOn       = document.getElementById('menuOn');
  const menuOff      = document.getElementById('menuOff');

  /* ═══════════════════════════════════════════════════════════════
     SONIDO DE MOTOR
     ═══════════════════════════════════════════════════════════════ */
  let audioCtx = null;
  let engineNodes = null;

  function ensureAudioCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function startEngine(modelName){
    const moto = motos.find(m => m.name === modelName) || motos[0];
    const cfg = moto.engine;
    const ctx = ensureAudioCtx();
    stopEngine(true);

    const t = ctx.currentTime;

    const master = ctx.createGain();
    master.gain.setValueAtTime(0, t);
    master.gain.linearRampToValueAtTime(cfg.volume, t + 0.5);
    master.connect(ctx.destination);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 800 + cfg.freq * 6;
    lp.Q.value = 1.2;
    lp.connect(master);

    const osc1 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc1.frequency.value = cfg.freq;

    const osc2 = ctx.createOscillator();
    osc2.type = 'square';
    osc2.frequency.value = cfg.freq * cfg.harmonic;

    const osc1Gain = ctx.createGain(); osc1Gain.gain.value = 0.65;
    const osc2Gain = ctx.createGain(); osc2Gain.gain.value = 0.30;

    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const noiseData = noiseBuf.getChannelData(0);
    for (let i = 0; i < noiseData.length; i++){
      noiseData[i] = (Math.random() * 2 - 1) * cfg.roughness * 0.5;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuf;
    noise.loop = true;
    const noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.10 * cfg.roughness;
    noise.connect(noiseGain);
    noiseGain.connect(lp);

    const lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = cfg.puttRate;

    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.35;

    const puttGain = ctx.createGain();
    puttGain.gain.value = 0.75;

    osc1.connect(osc1Gain);
    osc2.connect(osc2Gain);
    osc1Gain.connect(puttGain);
    osc2Gain.connect(puttGain);
    puttGain.connect(lp);

    lfo.connect(lfoGain);
    lfoGain.connect(puttGain.gain);

    osc1.start(t); osc2.start(t); lfo.start(t); noise.start(t);

    engineNodes = { master, osc1, osc2, lfo, noise, cfg };
  }

  function stopEngine(immediate){
    if (!engineNodes) return;
    const { master, osc1, osc2, lfo, noise } = engineNodes;
    const t = audioCtx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(0, t + (immediate ? 0.05 : 0.35));

    const nodes = engineNodes;
    engineNodes = null;

    setTimeout(() => {
      [osc1, osc2, lfo, noise].forEach(n => { try { n.stop(); } catch(e){} });
    }, immediate ? 80 : 400);
  }

  /* ═══════════════════════════════════════════════════════════════
     RENDER
     ═══════════════════════════════════════════════════════════════ */
  function render(){
    const m = motos[current];
    specModel.textContent = m.name;
    specRefer.textContent = m.refer;
    specColor.textContent = m.color;
    motoImg.src = m.img;
    motoImg.alt = m.name;
  }

  /* ═══════════════════════════════════════════════════════════════
     FUNCIÓN CLAVE — Aplica las imágenes de la escena según el tema
     ═══════════════════════════════════════════════════════════════ */
  function applySceneImages(isDark){
    const sceneImgs = isDark ? SCENE_NIGHT : SCENE_DAY;
    layerSky.style.backgroundImage  = `url('${sceneImgs.sky}')`;
    layerMtn.style.backgroundImage  = `url('${sceneImgs.mountains}')`;
    layerRoad.style.backgroundImage = `url('${sceneImgs.road}')`;
  }

  /* ═══════════════════════════════════════════════════════════════
     ESTADOS DE LA ESCENA
     ═══════════════════════════════════════════════════════════════ */
  function clearSceneState(){
    scene.classList.remove('is-forward', 'is-back');
  }

  function setActive(btn){
    [menuOn, menuNext, menuStop, menuPrev, menuOff].forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
  }

  function turnOn(){
    engineOn = true;
    motoImg.classList.add('is-running');
    clearSceneState();
    startEngine(motos[current].name);
    setActive(menuOn);
  }

  function turnOff(){
    engineOn = false;
    motoImg.classList.remove('is-running');
    clearSceneState();
    stopEngine(false);
    setActive(menuOff);
  }

  function goForward(){
    engineOn = true;
    motoImg.classList.add('is-running');
    clearSceneState();
    scene.classList.add('is-forward');
    startEngine(motos[current].name);
    setActive(menuNext);
  }

  function goBack(){
    engineOn = true;
    motoImg.classList.add('is-running');
    clearSceneState();
    scene.classList.add('is-back');
    startEngine(motos[current].name);
    setActive(menuPrev);
  }

  /* STOP → mueve el paisaje pero NO apaga el motor */
  function goStop(){
    engineOn = true;
    motoImg.classList.remove('is-running');
    clearSceneState();
    if (!engineNodes){
      startEngine(motos[current].name);
    }
    setActive(menuStop);
  }

  /* NAVEGACIÓN */
  function restartEngineIfOn(){
    if (!engineOn) return;
    stopEngine(false);
    setTimeout(() => engineOn && startEngine(motos[current].name), 380);
  }
  function goPrevModel(){ current = (current - 1 + motos.length) % motos.length; render(); restartEngineIfOn(); }
  function goNextModel(){ current = (current + 1) % motos.length; render(); restartEngineIfOn(); }

  prevBtn.addEventListener('click', goPrevModel);
  nextBtn.addEventListener('click', goNextModel);

  menuOn.addEventListener('click', turnOn);
  menuOff.addEventListener('click', turnOff);
  menuNext.addEventListener('click', goForward);
  menuPrev.addEventListener('click', goBack);
  menuStop.addEventListener('click', goStop);

  /* ═══════════════════════════════════════════════════════════════
     TEMA CLARO / OSCURO — cambia logos E imágenes del paisaje
     ═══════════════════════════════════════════════════════════════ */
  function setTheme(isDark){
    vhc.classList.toggle('dark', isDark);
    document.body.style.background = isDark ? '#05080a' : '#ffffff';

    // Logos
    logoHeader.src = isDark ? LOGO_DARK : LOGO_LIGHT;
    logoNav.src    = isDark ? LOGO_DARK : LOGO_LIGHT;

    // ⬇⬇ Imágenes del paisaje (3 capas) ⬇⬇
    applySceneImages(isDark);

    // Icono del botón Mode
    modeIcon.innerHTML = isDark
      ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor" stroke="none"></path>'
      : '<circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>';
  }

  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  setTheme(darkQuery.matches);
  darkQuery.addEventListener('change', e => setTheme(e.matches));
  modeToggle.addEventListener('click', () => setTheme(!vhc.classList.contains('dark')));

  render();
</script>
</body>
</html>
