<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01 - Write</title>
    <link rel="stylesheet" href="../04-js/css/style.css" />
    <style>
        section {
            flex: 1; /* Ocupa todo el espacio restante */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Opcional: ajustar el reloj para que se vea bien */
        #clock {
            font-family: 'Courier New', monospace;
            font-size: 3.5rem;
            font-weight: bold;
            color: #f7df1e;
            background: #0a0a12;
            padding: 1rem 2rem;
            border-radius: 16px;
            border: 2px solid #f7df1e;
            display: inline-block;
            box-shadow: 0 0 30px rgba(247, 223, 30, 0.2);
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(247, 223, 30, 0.4);
        }
    </style>
</head>
<body>

    <a href="../04-js/index.html" class="home-button">
    <span class="home-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </span>
    <span class="home-text">Volver</span>
</a>
    <main>
        <header>
            <div class="recuadro">
            <h1>02 - comments</h1>
            <h4>add comments to explain and annotate your code</h4>
               <p>digital time. <br></p>
            </div>
        </header>

        <section>
            <!-- Reloj en tiempo real -->
            <div id="clock"></div>
        </section>
    </main>
    <script>
        // Función para actualizar el reloj
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timeString = `${hours}:${minutes}:${seconds}`;
            document.getElementById('clock').textContent = timeString;
        }

        // Actualizar inmediatamente y luego cada segundo
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
