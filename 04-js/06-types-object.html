<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06 - Types of Objects</title>
    <link rel="stylesheet" href="../04-js/css/style.css"">

</head>
<body>
    <a href="../04-js/index.html" class="home-button">
    <span class="home-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </span>
    <span class="home-text">Volver</span>
</a>
    <main>
        <main>
            <header>
                <h1>06 - Types of Objects</h1>
                <h2>Understand and work with different object types.</h2>
            </header>
            <section>
                <div class="recuadro">
                    <ul class="objects"></ul>
                </div>
            </section>
            <script>
                //Elements
                const objs = document.querySelector('.objects');

                //Object String
                const string = new String('JavaScript 💛');
                objs.innerHTML =`<li>${string}-> Object: ${string.constructor.name} </li>`;

                //Object Number
                const number = new Number(256);
                objs.innerHTML += `<li>${number} -> Object: ${number.constructor.name} </li>`;

                //Object Boolean
                const bool = new Boolean(512>128);
                objs.innerHTML += `<li>${bool} -> Object: ${bool.constructor.name} </li>`;

                //Object Array
                const arr = new Array('🚅', '🏍️', '🚗', '🚁');
                objs.innerHTML += `<li>${arr} -> Object: ${arr.constructor.name} </li>`;

                //Object Date
                const dt = new Date('12/12/2026');
                objs.innerHTML += `<li> ${dt.getFullYear()} -> Object: ${dt.constructor.name} </li>`;

                //Object Object
                const obj = new Object('Vehicle');
                objs.innerHTML += `<li> ${obj} -> Object: ${obj.constructor.name} </li>`;
            </script>
        </main>
</body>
</html>
